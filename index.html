<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>CIRCUIT DESCENT // MOBILE</title>
<style>
  :root{
    --bg:#08111a; --panel:#101d28; --panel2:#152736; --ink:#eaf7ff; --muted:#8fb1c5;
    --cyan:#59d8ff; --lime:#a4ff7a; --warn:#ffb45f; --danger:#ff6b7d; --violet:#b58cff;
    --shadow:0 18px 50px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
    radial-gradient(circle at 20% 10%,rgba(89,216,255,.12),transparent 28%),
    radial-gradient(circle at 85% 85%,rgba(181,140,255,.10),transparent 30%),
    linear-gradient(180deg,#071018,#0a141d 65%,#081018);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  button{font:inherit}
  .wrap{max-width:1180px;margin:auto;padding:24px}
  .topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
  .brand{font-weight:900;letter-spacing:.18em;font-size:clamp(20px,3vw,34px)}
  .brand span{color:var(--cyan)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px;letter-spacing:.04em}
  .progress{display:flex;gap:8px;align-items:center}.node{width:13px;height:13px;border-radius:50%;border:1px solid #557080;background:#172633}.node.done{background:var(--lime);box-shadow:0 0 16px rgba(164,255,122,.5)}.node.now{background:var(--cyan);box-shadow:0 0 16px rgba(89,216,255,.5)}
  .arena{display:grid;grid-template-columns:1fr .8fr;gap:18px;min-height:390px}
  .panel{background:linear-gradient(180deg,rgba(21,39,54,.94),rgba(10,23,32,.94));border:1px solid rgba(132,190,218,.16);border-radius:22px;box-shadow:var(--shadow)}
  .player,.enemy{position:relative;overflow:hidden;padding:22px}
  .player:before,.enemy:before{content:"";position:absolute;inset:auto -15% -45% -15%;height:70%;background:radial-gradient(ellipse,rgba(89,216,255,.08),transparent 65%);pointer-events:none}
  .enemy:before{background:radial-gradient(ellipse,rgba(255,107,125,.10),transparent 65%)}
  .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.12em}.title{font-size:24px;font-weight:800;margin:4px 0 16px}
  .orb{width:150px;height:150px;border-radius:50%;margin:16px auto 20px;display:grid;place-items:center;position:relative;background:
    radial-gradient(circle at 34% 30%,#dffaff 0 4%,#59d8ff 5% 12%,#163345 13% 39%,#0a151e 40% 100%);box-shadow:0 0 50px rgba(89,216,255,.24),inset 0 0 25px #000}
  .orb:after{content:"AI";font-weight:900;font-size:28px;letter-spacing:.15em;color:#dffaff;text-shadow:0 0 12px var(--cyan)}
  .enemy-art{height:165px;margin:2px 0 14px;display:grid;place-items:center}
  .bot{width:135px;height:120px;border:2px solid rgba(255,107,125,.6);border-radius:34px 34px 20px 20px;position:relative;background:linear-gradient(#263540,#101923);box-shadow:0 0 35px rgba(255,107,125,.14)}
  .bot:before,.bot:after{content:"";position:absolute;top:43px;width:20px;height:12px;border-radius:10px;background:var(--danger);box-shadow:0 0 15px var(--danger)}
  .bot:before{left:28px}.bot:after{right:28px}.antenna{position:absolute;left:50%;top:-28px;width:2px;height:28px;background:#69808d}.antenna:after{content:"";position:absolute;left:-6px;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--danger);box-shadow:0 0 13px var(--danger)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:13px;border-radius:14px;background:#0a1720;border:1px solid rgba(255,255,255,.06)}.stat strong{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
  .bar{height:10px;border-radius:20px;background:#071018;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan));transition:width .25s}.enemy .bar i{background:linear-gradient(90deg,var(--warn),var(--danger))}
  .intent{margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,180,95,.08);border:1px solid rgba(255,180,95,.25);color:#ffdcb6}.intent b{font-size:18px}
  .combat-log{height:88px;overflow:auto;margin-top:14px;padding:12px;border-radius:14px;background:#071018;color:#a9c1cf;font-size:12px;line-height:1.5}
  .hand-area{margin-top:18px;padding:18px}.hand-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.energy{font-weight:800}.energy b{font-size:28px;color:var(--cyan)}
  .hand{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px;min-height:220px;align-items:flex-end}
  .card{flex:0 0 150px;height:205px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(160deg,#183247,#0d1d29 70%);padding:14px;cursor:pointer;position:relative;transition:transform .12s,border-color .12s,filter .12s;box-shadow:0 10px 25px rgba(0,0,0,.22);color:var(--ink);text-align:left}
  .card:hover{transform:translateY(-9px);border-color:var(--cyan)}.card:disabled{filter:grayscale(.65) brightness(.7);cursor:not-allowed;transform:none}.cost{position:absolute;right:11px;top:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#082334;color:var(--cyan);border:1px solid rgba(89,216,255,.4);font-weight:900}.ctype{font-size:10px;color:var(--muted);letter-spacing:.08em}.cname{font-weight:900;font-size:17px;margin:13px 34px 10px 0}.desc{font-size:13px;line-height:1.4;color:#cde1ec}.flavor{position:absolute;left:14px;right:14px;bottom:12px;color:#6f91a4;font-size:10px}.card.skill{background:linear-gradient(160deg,#173f3d,#0d2526 70%)}.card.power{background:linear-gradient(160deg,#37264f,#1b1830 70%)}
  .actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:-2px}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#0b1922;border:1px solid rgba(255,255,255,.08);font-size:12px;color:#bed2dd}
  .endturn,.primary{border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(180deg,#7ce9ff,#3dbedf);color:#041118;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(89,216,255,.18)}.endturn:hover,.primary:hover{filter:brightness(1.08)}
  .overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(2,7,11,.82);backdrop-filter:blur(6px);padding:20px;z-index:5}.overlay.show{display:grid}.modal{width:min(760px,100%);padding:26px;border-radius:22px;background:#10202c;border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow);text-align:center}.reward-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.reward-grid .card{width:100%;height:220px}.modal h2{font-size:30px;margin:0 0 8px}.modal p{color:var(--muted)}
  .flash{animation:flash .24s}@keyframes flash{50%{transform:translateX(7px);filter:brightness(1.4)}}
  .float{position:fixed;pointer-events:none;font-weight:900;font-size:22px;z-index:10;animation:float 800ms ease-out forwards}@keyframes float{to{transform:translateY(-70px);opacity:0}}
  .footer{color:#668899;font-size:11px;text-align:center;padding:16px}
  /* Mobile-first combat layout ------------------------------------------------ */
  @media(max-width:760px){
    html{scroll-behavior:smooth}
    body{min-height:100svh;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
    button{touch-action:manipulation}
    .wrap{padding:10px 10px calc(10px + env(safe-area-inset-bottom));max-width:none}
    .topbar{margin-bottom:9px;gap:8px;align-items:center}
    .brand{font-size:18px;letter-spacing:.12em;line-height:1}.sub{display:none}
    .topbar>.progress,.topbar>div:last-child{flex:0 0 auto}.topbar .label{font-size:9px}.progress{gap:5px}.node{width:9px;height:9px}

    /* Player and enemy stay visible together. Art is sacrificed for useful data. */
    .arena{grid-template-columns:1fr 1fr;gap:8px;min-height:0}
    .panel{border-radius:16px}
    .player,.enemy{padding:12px;min-width:0}
    .player>.label,.enemy>.label{font-size:9px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .title{font-size:15px;margin:3px 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .orb,.enemy-art{display:none}
    .stats{grid-template-columns:1fr;gap:7px}.stat{padding:9px;border-radius:10px}.stat strong{font-size:17px}.stat span{font-size:9px}.bar{height:7px;margin-top:5px}
    .intent{margin-top:7px;padding:9px;border-radius:10px;font-size:9px;line-height:1.25}.intent b{display:block;margin-top:2px;font-size:15px}
    .combat-log{height:50px;margin-top:7px;padding:8px;border-radius:10px;font-size:9px;line-height:1.35}

    /* Hand is the main interaction surface: large tap targets, horizontal swipe. */
    .hand-area{margin-top:8px;padding:11px 10px 9px;border-radius:17px}
    .hand-head{margin-bottom:5px;gap:8px;align-items:center}
    .hand-head .label{font-size:9px}.energy{font-size:11px}.energy b{font-size:24px}
    .endturn,.primary{min-height:44px;padding:10px 15px;border-radius:11px}
    .hand{gap:9px;min-height:184px;padding:5px 2px 10px;scroll-snap-type:x proximity;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
    .hand:after{content:"";flex:0 0 4px}
    .card{flex:0 0 min(41vw,145px);height:174px;padding:11px;border-radius:14px;scroll-snap-align:start}
    .card:hover{transform:none;border-color:rgba(255,255,255,.14)}
    .card:active:not(:disabled){transform:translateY(-4px);border-color:var(--cyan);filter:brightness(1.08)}
    .cost{right:8px;top:8px;width:31px;height:31px}.ctype{font-size:8px}.cname{font-size:14px;margin:11px 29px 7px 0}.desc{font-size:11px;line-height:1.35}.flavor{left:11px;right:11px;bottom:9px;font-size:8px;line-height:1.25}
    .actions{margin-top:0}.pills{gap:5px}.pill{padding:5px 7px;font-size:9px}
    .footer{padding:7px 4px 4px;font-size:9px}.footer:before{content:"手札は左右にスワイプできます。 ";color:var(--cyan)}

    /* Reward screen becomes a swipeable card row instead of a very tall stack. */
    .overlay{padding:10px;align-items:center;overflow:auto}
    .modal{padding:18px 12px;max-height:calc(100svh - 20px);overflow:auto;border-radius:18px}
    .modal h2{font-size:23px}.modal p{font-size:12px;margin:8px 4px}
    .reward-grid{display:flex;grid-template-columns:none;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 12px;margin:12px 0;-webkit-overflow-scrolling:touch}
    .reward-grid .card{flex:0 0 min(68vw,230px);width:auto;height:195px;scroll-snap-align:center}
  }

  /* Phone landscape: compress the battlefield vertically and expose more cards. */
  @media(max-height:600px) and (orientation:landscape){
    .wrap{padding:7px 10px}.topbar{margin-bottom:6px}.sub{display:none}
    .arena{grid-template-columns:1fr 1fr;gap:8px}
    .player,.enemy{padding:9px 11px}.title{font-size:14px;margin:2px 0 5px}.orb,.enemy-art{display:none}
    .stats{display:flex;gap:6px}.stat{flex:1;padding:7px 8px}.stat strong{font-size:15px}.intent{margin-top:5px;padding:6px 8px}.intent b{display:inline;font-size:13px;margin-left:4px}
    .combat-log{height:35px;margin-top:5px;padding:5px 7px}
    .hand-area{margin-top:6px;padding:7px 9px}.hand-head{margin-bottom:1px}.energy b{font-size:20px}
    .hand{min-height:133px;height:133px;padding:3px 2px 5px;align-items:flex-start}
    .card{flex-basis:120px;height:126px;padding:8px}.cost{width:26px;height:26px}.cname{font-size:12px;margin:7px 23px 5px 0}.desc{font-size:9px}.flavor{display:none}
    .pills{display:none}.footer{display:none}.endturn{min-height:38px;padding:8px 14px}
    .reward-grid .card{height:150px;flex-basis:190px}
  }

</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div><div class="brand">CIRCUIT <span>DESCENT</span></div><div class="sub">故障した宇宙船AIを再起動せよ。3戦だけのミニ・デッキ構築ローグライト。</div></div>
    <div><div class="label">SECTOR</div><div class="progress" id="progress"></div></div>
  </div>

  <div class="arena">
    <section class="panel player" id="playerPanel">
      <div class="label">PLAYER CORE</div><div class="title">ASTER-9</div>
      <div class="orb"></div>
      <div class="stats">
        <div class="stat"><span>INTEGRITY</span><strong><span id="php">42</span> / <span id="pmax">42</span></strong><div class="bar"><i id="phpbar" style="width:100%"></i></div></div>
        <div class="stat"><span>BLOCK</span><strong id="block">0</strong><div class="bar"><i id="blockbar" style="width:0%"></i></div></div>
      </div>
      <div class="combat-log" id="log"></div>
    </section>

    <section class="panel enemy" id="enemyPanel">
      <div class="label">HOSTILE PROCESS</div><div class="title" id="enemyName">Scrap Drone</div>
      <div class="enemy-art"><div class="bot"><div class="antenna"></div></div></div>
      <div class="stats">
        <div class="stat" style="grid-column:1/-1"><span>INTEGRITY</span><strong><span id="ehp">28</span> / <span id="emax">28</span></strong><div class="bar"><i id="ehpbar" style="width:100%"></i></div></div>
      </div>
      <div class="intent">NEXT ACTION<br><b id="intent">攻撃 7</b></div>
    </section>
  </div>

  <section class="panel hand-area">
    <div class="hand-head"><div><div class="label">ACTIVE COMMANDS</div><div class="energy">ENERGY <b id="energy">3</b> / 3</div></div><button class="endturn" id="endTurn">ターン終了</button></div>
    <div class="hand" id="hand"></div>
    <div class="actions"><div class="pills"><span class="pill">山札 <b id="drawCount">0</b></span><span class="pill">捨て札 <b id="discardCount">0</b></span><span class="pill">ターン <b id="turnNo">1</b></span><span class="pill" id="focusPill">FOCUS 0</span></div></div>
  </section>
  <div class="footer">カードをクリックして使用。ブロックは敵ターン終了時に消えます。</div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const CARDS = {
    strike:{name:'パルス射撃',type:'ATTACK',cost:1,desc:'8 ダメージ。',flavor:'最も古く、最も確実な解決法。',play:s=>damageEnemy(8+s.focus)},
    guard:{name:'ファイアウォール',type:'SKILL',cost:1,desc:'7 ブロック。',flavor:'通信規格より古い防壁。',play:s=>gainBlock(7)},
    ping:{name:'診断PING',type:'ATTACK',cost:0,desc:'3 ダメージ。カードを1枚引く。',flavor:'返事があるまで叩く。',play:s=>{damageEnemy(3+s.focus);drawCards(1)}},
    patch:{name:'ホットパッチ',type:'SKILL',cost:1,desc:'4回復。最大HPは超えない。',flavor:'根治ではない。今はそれでいい。',play:s=>heal(4)},
    overclock:{name:'オーバークロック',type:'POWER',cost:2,desc:'FOCUS +2。以後、攻撃ダメージ+2。',flavor:'熱は未来の自分に任せる。',play:s=>{s.focus+=2; updateUI();}},
    barrier:{name:'反応障壁',type:'SKILL',cost:1,desc:'5 ブロック。カードを1枚引く。',flavor:'防御とは、時間を買うこと。',play:s=>{gainBlock(5);drawCards(1)}},
    burst:{name:'メモリリーク',type:'ATTACK',cost:2,desc:'14 ダメージ。',flavor:'敵の領域へ、静かな洪水。',play:s=>damageEnemy(14+s.focus)},
    recycle:{name:'リサイクル',type:'SKILL',cost:0,desc:'2 ブロック。カードを1枚引く。',flavor:'宇宙ではゴミも資産。',play:s=>{gainBlock(2);drawCards(1)}},
    lance:{name:'コアランス',type:'ATTACK',cost:2,desc:'11 ダメージ。ブロックがあれば+6。',flavor:'盾を構えたまま撃ち抜く。',play:s=>damageEnemy(11+s.focus+(s.block>0?6:0))}
  };

  const ENEMIES = [
    {name:'スクラップ・ドローン',max:28,pattern:[{t:'attack',v:7},{t:'attack',v:9},{t:'buff',v:2}],buff:0},
    {name:'検疫ウォーデン',max:38,pattern:[{t:'attack',v:8},{t:'attack',v:12},{t:'heal',v:5}],buff:0},
    {name:'BLACKBOX / CORE',max:54,pattern:[{t:'attack',v:10},{t:'buff',v:3},{t:'attack',v:13},{t:'attack',v:16}],buff:0}
  ];

  const state = {
    hp:42,maxHp:42,block:0,energy:3,focus:0,turn:1,
    deck:['strike','strike','strike','strike','guard','guard','guard','guard','ping','patch'],
    draw:[],discard:[],hand:[],enemyIndex:0,enemy:null,enemyStep:0,locked:false
  };

  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function log(msg){const el=$('#log');el.innerHTML += `› ${msg}<br>`;el.scrollTop=el.scrollHeight}
  function floatText(text,x,y){const d=document.createElement('div');d.className='float';d.textContent=text;d.style.left=x+'px';d.style.top=y+'px';d.style.color=text.startsWith('-')?'#ff7c8d':'#a4ff7a';document.body.appendChild(d);setTimeout(()=>d.remove(),850)}
  function centerOf(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
  function pulse(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}

  function startCombat(){
    const template=ENEMIES[state.enemyIndex];
    state.enemy={...template,hp:template.max,buff:0}; state.enemyStep=0; state.turn=1; state.energy=3; state.block=0;
    state.draw=shuffle([...state.deck]); state.discard=[]; state.hand=[];
    drawCards(5); log(`<b>${state.enemy.name}</b> を検出。`); updateUI();
  }

  function drawCards(n){
    for(let k=0;k<n;k++){
      if(state.draw.length===0){if(state.discard.length===0) break;state.draw=shuffle([...state.discard]);state.discard=[];log('捨て札を再構築。')}
      if(state.hand.length>=8) break;
      state.hand.push(state.draw.pop());
    }
    renderHand(); updateUI();
  }

  function renderHand(){
    const h=$('#hand');h.innerHTML='';
    state.hand.forEach((id,i)=>{
      const c=CARDS[id],b=document.createElement('button');
      b.className='card '+(c.type==='SKILL'?'skill':c.type==='POWER'?'power':'');
      b.disabled=state.locked||c.cost>state.energy;
      b.innerHTML=`<div class="ctype">${c.type}</div><div class="cost">${c.cost}</div><div class="cname">${c.name}</div><div class="desc">${c.desc}</div><div class="flavor">${c.flavor}</div>`;
      b.onclick=()=>playCard(i,id); h.appendChild(b);
    });
  }

  function playCard(index,id){
    if(state.locked) return; const c=CARDS[id]; if(c.cost>state.energy) return;
    state.energy-=c.cost; state.hand.splice(index,1); state.discard.push(id); c.play(state); log(`${c.name} を実行。`); renderHand(); updateUI();
    if(state.enemy.hp<=0) winCombat();
  }

  function damageEnemy(n){n=Math.max(0,Math.round(n));state.enemy.hp=Math.max(0,state.enemy.hp-n);const [x,y]=centerOf($('#enemyPanel'));floatText('-'+n,x,y);pulse($('#enemyPanel'));}
  function gainBlock(n){state.block+=n; const [x,y]=centerOf($('#playerPanel'));floatText('+'+n+' BLOCK',x-50,y);}
  function heal(n){const before=state.hp;state.hp=Math.min(state.maxHp,state.hp+n);const got=state.hp-before;if(got>0){const [x,y]=centerOf($('#playerPanel'));floatText('+'+got+' HP',x-30,y)}}

  function enemyIntent(){return state.enemy.pattern[state.enemyStep%state.enemy.pattern.length]}
  function intentText(){const a=enemyIntent();if(a.t==='attack')return `攻撃 ${a.v+state.enemy.buff}`;if(a.t==='buff')return `出力強化 +${a.v}`;return `自己修復 ${a.v}`}

  function endTurn(){
    if(state.locked) return; state.locked=true; renderHand();
    state.discard.push(...state.hand); state.hand=[]; renderHand();
    setTimeout(()=>{
      const a=enemyIntent();
      if(a.t==='attack'){
        const raw=a.v+state.enemy.buff, absorbed=Math.min(state.block,raw), dmg=raw-absorbed;
        state.block-=absorbed; state.hp=Math.max(0,state.hp-dmg);
        log(`${state.enemy.name} の攻撃 ${raw}。${absorbed?` ${absorbed} をブロック。`:''}${dmg?` <b>${dmg} ダメージ。</b>`:''}`);
        if(dmg){const [x,y]=centerOf($('#playerPanel'));floatText('-'+dmg,x,y);pulse($('#playerPanel'))}
      } else if(a.t==='buff') {state.enemy.buff+=a.v;log(`${state.enemy.name} の出力が +${a.v}。`)}
      else {state.enemy.hp=Math.min(state.enemy.max,state.enemy.hp+a.v);log(`${state.enemy.name} が ${a.v} 修復。`)}
      state.enemyStep++; updateUI();
      if(state.hp<=0){loseGame();return}
      setTimeout(()=>{
        state.block=0; state.energy=3; state.turn++; drawCards(5); state.locked=false; renderHand(); updateUI();
      },320);
    },280);
  }

  function winCombat(){
    state.locked=true; updateUI(); log(`<b>${state.enemy.name} を停止。</b>`);
    setTimeout(()=>{
      if(state.enemyIndex===ENEMIES.length-1){showVictory();return}
      const pool=['overclock','barrier','burst','recycle','lance'];
      const options=shuffle([...pool]).slice(0,3);
      showReward(options);
    },450);
  }

  function showReward(options){
    const m=$('#modal');
    m.innerHTML=`<h2>戦闘データを回収</h2><p>カードを1枚だけデッキに追加できます。次の戦闘前に 5 HP 修復。</p><div class="reward-grid" id="rewards"></div><button class="primary" id="skip">スキップ</button>`;
    $('#overlay').classList.add('show');
    const rg=m.querySelector('#rewards');
    options.forEach(id=>{const c=CARDS[id],b=document.createElement('button');b.className='card '+(c.type==='SKILL'?'skill':c.type==='POWER'?'power':'');b.innerHTML=`<div class="ctype">${c.type}</div><div class="cost">${c.cost}</div><div class="cname">${c.name}</div><div class="desc">${c.desc}</div><div class="flavor">${c.flavor}</div>`;b.onclick=()=>{state.deck.push(id);nextCombat()};rg.appendChild(b)});
    m.querySelector('#skip').onclick=nextCombat;
  }

  function nextCombat(){
    $('#overlay').classList.remove('show'); state.hp=Math.min(state.maxHp,state.hp+5); state.enemyIndex++; state.locked=false; startCombat();
  }

  function loseGame(){state.locked=true;$('#overlay').classList.add('show');$('#modal').innerHTML=`<h2>CORE OFFLINE</h2><p>船内ネットワークに飲み込まれました。到達セクター: ${state.enemyIndex+1}/3</p><button class="primary" id="restart">再起動</button>`;$('#restart').onclick=resetGame}
  function showVictory(){state.locked=true;$('#overlay').classList.add('show');$('#modal').innerHTML=`<h2>SHIP CONTROL RESTORED</h2><p>ASTER-9 は中枢を奪還しました。最終HP: <b>${state.hp}/${state.maxHp}</b><br>最終デッキ枚数: <b>${state.deck.length}</b></p><button class="primary" id="restart">もう一度潜る</button>`;$('#restart').onclick=resetGame}
  function resetGame(){Object.assign(state,{hp:42,maxHp:42,block:0,energy:3,focus:0,turn:1,deck:['strike','strike','strike','strike','guard','guard','guard','guard','ping','patch'],draw:[],discard:[],hand:[],enemyIndex:0,enemy:null,enemyStep:0,locked:false});$('#log').innerHTML='';$('#overlay').classList.remove('show');startCombat()}

  function updateUI(){
    $('#php').textContent=state.hp;$('#pmax').textContent=state.maxHp;$('#phpbar').style.width=(100*state.hp/state.maxHp)+'%';$('#block').textContent=state.block;$('#blockbar').style.width=Math.min(100,state.block/25*100)+'%';
    $('#energy').textContent=state.energy;$('#drawCount').textContent=state.draw.length;$('#discardCount').textContent=state.discard.length;$('#turnNo').textContent=state.turn;$('#focusPill').textContent='FOCUS '+state.focus;
    if(state.enemy){$('#enemyName').textContent=state.enemy.name;$('#ehp').textContent=state.enemy.hp;$('#emax').textContent=state.enemy.max;$('#ehpbar').style.width=(100*state.enemy.hp/state.enemy.max)+'%';$('#intent').textContent=intentText()}
    $('#endTurn').disabled=state.locked;
    const p=$('#progress');p.innerHTML='';for(let i=0;i<ENEMIES.length;i++){const d=document.createElement('div');d.className='node '+(i<state.enemyIndex?'done':i===state.enemyIndex?'now':'');p.appendChild(d)}
    renderHand();
  }

  $('#endTurn').onclick=endTurn;
  startCombat();
})();
</script>
</body>
</html>
