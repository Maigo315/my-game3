<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>魔物娘ファクトリー 戦闘試作 v0.1</title>
<style>
:root{
  --bg:#11131a; --panel:#1b1f2a; --panel2:#242a38; --line:#394155; --text:#f3f5fa;
  --muted:#aeb6c8; --good:#8de3a5; --bad:#ff9696; --accent:#9ec5ff; --gold:#ffd479;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
body{overflow-x:hidden}
button{font:inherit;color:inherit}
#app{min-height:100dvh;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.title{font-weight:800;letter-spacing:.04em;font-size:clamp(16px,2.5vw,22px)}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:999px;background:#151923}
.screen{display:none}.screen.active{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px #0005}
#selectScreen{max-width:1180px;margin:auto}
.instructions{padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.instructions p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.roster{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:8px}
.pick-card{position:relative;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:7px;cursor:pointer;transition:.15s transform,.15s border-color}
.pick-card:active{transform:scale(.985)}.pick-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px #9ec5ff22 inset}
.pick-card img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 24%;border-radius:10px;background:#0d0f14}
.pick-name{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800;font-size:13px;margin-top:6px}
.rank{font-size:11px;padding:1px 5px;border-radius:5px;background:#4c5569;color:#fff}
.stats-mini{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;font-size:10px;color:var(--muted);margin-top:4px}
.detail{font-size:10px;color:#cbd1df;margin-top:5px;line-height:1.35;min-height:28px}
.select-footer{display:flex;justify-content:center;gap:10px;margin-top:12px;position:sticky;bottom:6px;z-index:5}
.primary,.secondary{border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-weight:800;background:var(--panel2);cursor:pointer}
.primary{background:#315a91;border-color:#5c8fd0}.primary:disabled{opacity:.4;cursor:not-allowed}
#battleScreen{height:calc(100dvh - 20px);max-height:760px;min-height:560px;display:none;grid-template-rows:auto 1fr auto;gap:7px;margin:auto;max-width:1250px}
#battleScreen.active{display:grid}
.battle-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side-title{font-size:12px;color:var(--muted);font-weight:700}.side-title.enemy{text-align:right}
.turn-chip{padding:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;font-weight:800;font-size:12px}
.arena{display:grid;grid-template-rows:1fr minmax(80px,.48fr) 1fr;gap:6px;min-height:0}
.team-row{display:flex;justify-content:center;align-items:stretch;gap:6px;min-height:0}
.unit-card{position:relative;width:min(23vw,190px);min-width:112px;background:var(--panel);border:2px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:44% 56%;cursor:pointer;transition:.12s border-color,.12s transform;min-height:0}
.unit-card.active{border-color:var(--accent)}.unit-card.targetable{border-color:var(--gold);animation:pulse 1s infinite alternate}.unit-card.dead{filter:grayscale(1);opacity:.5}.unit-card.summon{width:min(18vw,145px);opacity:.95}
@keyframes pulse{from{box-shadow:0 0 0 0 #ffd47922}to{box-shadow:0 0 0 4px #ffd47933}}
.portrait{min-width:0;position:relative;background:#0c0f15}.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.unit-info{padding:5px 6px;min-width:0;overflow:hidden}
.unit-name{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unit-sub{font-size:9px;color:var(--muted);margin-bottom:3px}
.hpbar{height:10px;background:#090b10;border-radius:999px;overflow:hidden;border:1px solid #353b48}.hpfill{height:100%;background:linear-gradient(90deg,#62cc78,#a5e67a);transition:width .25s}.hpfill.low{background:linear-gradient(90deg,#d66,#f0a06e)}
.hptext{font-size:9px;color:#dce2ee;text-align:right;margin-top:1px}.battle-stats{font-size:8px;color:var(--muted);line-height:1.35;margin-top:3px}.status-line{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;max-height:31px;overflow:hidden}.status-tag{font-size:8px;padding:1px 3px;border-radius:4px;background:#4b5264}.status-tag.good{background:#315d44}.status-tag.bad{background:#763f4b}.planned{position:absolute;left:3px;bottom:3px;font-size:8px;background:#10141ddd;border-radius:5px;padding:2px 4px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-panel{background:#0d1017;border:1px solid var(--line);border-radius:10px;padding:6px 9px;overflow:auto;font-size:11px;line-height:1.45;min-height:0}.log-panel p{margin:0 0 2px}.log-panel .sys{color:var(--accent)}.log-panel .damage{color:#ffd7a0}.log-panel .heal{color:var(--good)}.log-panel .warn{color:var(--bad)}
.command-panel{display:grid;grid-template-columns:minmax(180px,.7fr) 2fr auto;gap:7px;align-items:stretch;min-height:100px}
.actor-box,.commands,.turn-actions{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}.actor-box{font-size:11px;line-height:1.45}.actor-name{font-weight:900;font-size:13px}.actor-hint{color:var(--muted);font-size:10px}.commands{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.cmd{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 6px;cursor:pointer;text-align:left;min-width:0}.cmd:disabled{opacity:.4;cursor:not-allowed}.cmd strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cmd small{display:block;color:var(--muted);font-size:9px;line-height:1.25;margin-top:2px}.turn-actions{display:flex;flex-direction:column;gap:6px;justify-content:center}.turn-actions button{white-space:nowrap;padding:9px 10px}
.overlay{position:fixed;inset:0;background:#05070bcc;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}.overlay.show{display:flex}.result{max-width:450px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}.result h2{margin:0 0 8px;font-size:28px}.result p{color:var(--muted);font-size:13px}
.orientation{display:none;position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:20;background:#121722e8;border:1px solid var(--line);padding:5px 10px;border-radius:999px;font-size:10px;color:var(--muted)}
@media (orientation:portrait) and (max-width:700px){.orientation{display:block}.roster{grid-template-columns:repeat(2,1fr)}#battleScreen{height:auto;min-height:100dvh}.arena{grid-template-rows:auto 130px auto}.unit-card{width:31vw;min-width:100px;grid-template-columns:1fr;grid-template-rows:80px auto}.portrait img{object-position:50% 20%}.command-panel{grid-template-columns:1fr}.commands{grid-template-columns:repeat(3,1fr)}.turn-actions{flex-direction:row}.battle-stats{display:none}}
@media (max-width:900px) and (orientation:landscape){#app{padding-top:5px}.topbar{margin-bottom:4px}.title{font-size:14px}.roster{grid-template-columns:repeat(6,1fr)}.pick-card{padding:5px}.pick-card img{aspect-ratio:1/1.15}.detail{display:none}#battleScreen{height:calc(100dvh - 10px);min-height:340px}.arena{grid-template-rows:1fr minmax(58px,.42fr) 1fr}.unit-card{width:min(22vw,168px);min-width:100px}.unit-info{padding:3px 4px}.status-line{max-height:20px}.command-panel{min-height:78px;grid-template-columns:minmax(145px,.65fr) 2fr auto}.actor-box,.commands,.turn-actions{padding:5px}.cmd{padding:5px 4px}.log-panel{font-size:9px}.turn-actions button{padding:7px 8px;font-size:10px}}
</style>
</head>
<body>
<div class="orientation">横向き推奨です</div>
<div id="app">
  <div class="topbar"><div class="title">魔物娘ファクトリー <span style="color:var(--muted);font-weight:600">戦闘試作</span></div><div class="badge">v0.1 / 6キャラ</div></div>

  <section id="selectScreen" class="screen active">
    <div class="instructions panel">
      <p><b>味方にする3体を選択。</b> 残り3体が敵になります。<br>この版では基礎バランスを見るため、性格・個体差はOFFです。</p>
      <label class="toggle"><input id="twoSkillMode" type="checkbox"> 本番想定：各キャラ3スキルから2つ抽選</label>
    </div>
    <div id="roster" class="roster"></div>
    <div class="select-footer"><button id="randomPick" class="secondary">ランダム3体</button><button id="startBattle" class="primary" disabled>この3体で戦う</button></div>
  </section>

  <section id="battleScreen" class="screen">
    <div class="battle-head"><div class="side-title">味方</div><div id="turnChip" class="turn-chip">TURN 1</div><div class="side-title enemy">敵</div></div>
    <div class="arena">
      <div id="enemyRow" class="team-row"></div>
      <div id="battleLog" class="log-panel"></div>
      <div id="allyRow" class="team-row"></div>
    </div>
    <div class="command-panel">
      <div id="actorBox" class="actor-box"></div>
      <div id="commands" class="commands"></div>
      <div class="turn-actions">
        <button id="clearPlan" class="secondary">入力クリア</button>
        <button id="executeTurn" class="primary" disabled>ターン開始</button>
      </div>
    </div>
  </section>
</div>

<div id="resultOverlay" class="overlay"><div class="result"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="backToSelect" class="primary">編成選択へ戻る</button></div></div>

let selected=new Set();
let battle=null;
let selectedActorId=null;
let pendingCommand=null;

function renderRoster(){
  const root=document.getElementById('roster');root.innerHTML='';
  CHARACTERS.forEach(c=>{
    const d=document.createElement('div');d.className='pick-card'+(selected.has(c.id)?' selected':'');d.dataset.id=c.id;
    const rs=c.resist.length?c.resist.map(x=>ELEMENT_LABEL[x]).join('・'):'なし';
    const wk=c.weak.length?c.weak.map(x=>ELEMENT_LABEL[x]).join('・'):'なし';
    d.innerHTML=`<img src="${c.img}" alt="${c.name}"><div class="pick-name"><span>${c.name}</span><span class="rank">${c.rank}</span></div><div class="stats-mini"><span>HP ${c.hp}</span><span>攻 ${c.atk}</span><span>防 ${c.def}</span><span>速 ${c.spd}</span></div><div class="detail">${c.family} / 耐:${rs} / 弱:${wk}</div>`;
    d.onclick=()=>togglePick(c.id);root.appendChild(d);
  });
  document.getElementById('startBattle').disabled=selected.size!==3;
}
function togglePick(id){if(selected.has(id))selected.delete(id);else if(selected.size<3)selected.add(id);renderRoster()}
document.getElementById('randomPick').onclick=()=>{selected=new Set(shuffled(CHARACTERS).slice(0,3).map(c=>c.id));renderRoster()};
document.getElementById('startBattle').onclick=startBattle;

function makeUnit(c,side,index){
  const two=document.getElementById('twoSkillMode').checked;
  const skills=two?shuffled(c.skills).slice(0,2):[...c.skills];
  return {uid:`${side}_${c.id}_${index}_${Math.random().toString(36).slice(2,6)}`,templateId:c.id,name:c.name,rank:c.rank,family:c.family,img:c.img,side,index,maxHp:c.hp,hp:c.hp,baseAtk:c.atk,baseDef:c.def,baseSpd:c.spd,resist:[...c.resist],weak:[...c.weak],passive:c.passive,passiveText:c.passiveText,skillIds:skills,cd:{},buffs:[],statuses:{},mount:false,dead:false,isSummon:false,normalCount:0,swiftStacks:0,planned:null,actionState:'none',diedThisTurn:false};
}
function startBattle(){
  const allies=CHARACTERS.filter(c=>selected.has(c.id)).map((c,i)=>makeUnit(c,'ally',i));
  const enemies=CHARACTERS.filter(c=>!selected.has(c.id)).map((c,i)=>makeUnit(c,'enemy',i));
  battle={turn:1,allies,enemies,log:[],busy:false,over:false};selectedActorId=allies[0].uid;pendingCommand=null;
  document.getElementById('selectScreen').classList.remove('active');document.getElementById('battleScreen').classList.add('active');
  log('戦闘開始。味方3体の行動を選んでください。','sys');renderBattle();
}
function allUnits(){return [...battle.allies,...battle.enemies]}
function sideUnits(side){return side==='ally'?battle.allies:battle.enemies}
function opponents(side){return side==='ally'?battle.enemies:battle.allies}
function living(arr){return arr.filter(u=>!u.dead&&u.hp>0)}
function getUnit(uid){return allUnits().find(u=>u.uid===uid)}
function effectiveStat(u,stat){
  let sum=0;u.buffs.forEach(b=>{if(b.stat===stat)sum+=b.amount});
  if(stat==='spd'&&u.passive==='swiftDog')sum+=u.swiftStacks*.20;
  sum=clamp(sum,-.5,1.0);const base=stat==='atk'?u.baseAtk:stat==='def'?u.baseDef:u.baseSpd;return Math.max(1,base*(1+sum));
}
function buffSummary(u){
  const labels=[];const sum={atk:0,def:0,spd:0};u.buffs.forEach(b=>sum[b.stat]+=b.amount);if(u.passive==='swiftDog')sum.spd+=u.swiftStacks*.20;
  for(const [k,l] of [['atk','攻'],['def','防'],['spd','速']])if(Math.abs(sum[k])>.001)labels.push(`${l}${sum[k]>0?'+':''}${Math.round(sum[k]*100)}%`);
  return labels;
}
function statusTags(u){
  const t=[];if(u.statuses.poison)t.push(['毒','bad']);if(u.statuses.seal)t.push(['封印','bad']);if(u.statuses.stop)t.push([`停止${u.statuses.stop.charges}`,'bad']);if(u.mount)t.push(['マウント','good']);buffSummary(u).forEach(x=>t.push([x,x.includes('-')?'bad':'good']));return t;
}
function renderBattle(){
  document.getElementById('turnChip').textContent=`TURN ${battle.turn}`;
  renderTeam('enemyRow',battle.enemies);renderTeam('allyRow',battle.allies);renderLog();renderCommandPanel();
}
function renderTeam(id,units){
  const root=document.getElementById(id);root.innerHTML='';
  units.forEach(u=>{
    const div=document.createElement('div');
    const targetable=pendingCommand&&isValidTarget(u,pendingCommand);
    div.className=`unit-card ${u.dead?'dead ':''}${u.uid===selectedActorId?'active ':''}${targetable?'targetable ':''}${u.isSummon?'summon ':''}`;
    const pct=clamp(u.hp/u.maxHp*100,0,100);const tags=statusTags(u).map(([x,c])=>`<span class="status-tag ${c}">${x}</span>`).join('');
    const plan=u.planned?`<div class="planned">予約: ${u.planned.label}</div>`:'';
    div.innerHTML=`<div class="portrait"><img src="${u.img}" alt="${u.name}">${plan}</div><div class="unit-info"><div class="unit-name">${u.name}${u.isSummon?'・分裂体':''}</div><div class="unit-sub">${u.family}${u.isSummon?'':' ['+u.rank+']'}</div><div class="hpbar"><div class="hpfill ${pct<30?'low':''}" style="width:${pct}%"></div></div><div class="hptext">${Math.ceil(u.hp)} / ${u.maxHp}</div><div class="battle-stats">攻${Math.round(effectiveStat(u,'atk'))} 防${Math.round(effectiveStat(u,'def'))} 速${Math.round(effectiveStat(u,'spd'))}</div><div class="status-line">${tags}</div></div>`;
    div.onclick=()=>onUnitClick(u);root.appendChild(div);
  });
}
function onUnitClick(u){
  if(battle.busy||battle.over)return;
  if(pendingCommand&&isValidTarget(u,pendingCommand)){assignPendingTarget(u);return}
  if(u.side==='ally'&&!u.dead&&!u.isSummon){selectedActorId=u.uid;pendingCommand=null;renderBattle()}
}
function renderCommandPanel(){
  const actor=getUnit(selectedActorId);const box=document.getElementById('actorBox');const root=document.getElementById('commands');root.innerHTML='';
  if(!actor||actor.dead){box.innerHTML='<span class="actor-hint">行動可能な味方を選択してください。</span>';return}
  box.innerHTML=`<div class="actor-name">${actor.name}</div><div>HP ${Math.ceil(actor.hp)}/${actor.maxHp}　攻${Math.round(effectiveStat(actor,'atk'))} 防${Math.round(effectiveStat(actor,'def'))} 速${Math.round(effectiveStat(actor,'spd'))}</div><div class="actor-hint">${actor.passiveText}</div>`;
  const normal={id:'normal',name:'通常攻撃',target:'enemy',desc:'威力250・無属性・非魔法。',kind:'normal'};addCommandButton(actor,normal);
  actor.skillIds.forEach(id=>addCommandButton(actor,{id,...SKILLS[id]}));
  document.getElementById('executeTurn').disabled=!canExecuteTurn()||battle.busy;
  document.getElementById('clearPlan').disabled=battle.busy;
}
function addCommandButton(actor,s){
  const root=document.getElementById('commands');const b=document.createElement('button');b.className='cmd';const cd=actor.cd[s.id]||0;const sealed=!!actor.statuses.seal&&s.id!=='normal';
  const noDeadTarget=s.target==='deadAlly'&&!sideUnits(actor.side).some(x=>x.dead&&!x.isSummon);
  b.disabled=actor.dead||cd>0||sealed||noDeadTarget||battle.busy;
  b.innerHTML=`<strong>${s.name}${s.id==='normal'?'':` [${cd>0?cd:s.ct}]`}</strong><small>${sealed?'封印中':noDeadTarget?'対象なし':cd>0?`あと${cd}`:s.desc}</small>`;
  b.onclick=()=>chooseCommand(actor,s);root.appendChild(b);
}
function chooseCommand(actor,s){
  pendingCommand={actorUid:actor.uid,skill:s};
  if(s.target==='none'||s.target==='self'||s.target==='allAllies'||s.target==='twoEnemies'){
    const target=s.target==='self'?actor:null;finalizePlan(actor,s,target);pendingCommand=null;renderBattle();return;
  }
  renderBattle();
}
function isValidTarget(u,p){
  const a=getUnit(p.actorUid),t=p.skill.target;if(!a)return false;
  if(t==='enemy')return u.side!==a.side&&!u.dead;
  if(t==='ally')return u.side===a.side&&!u.dead;
  if(t==='deadAlly')return u.side===a.side&&u.dead&&!u.isSummon;
  return false;
}
function assignPendingTarget(u){const a=getUnit(pendingCommand.actorUid),s=pendingCommand.skill;finalizePlan(a,s,u);pendingCommand=null;renderBattle()}
function finalizePlan(actor,s,target){
  let label=s.name;if(target)label+=` → ${target.name}`;actor.planned={skillId:s.id,targetUid:target?.uid||null,label};
  const next=battle.allies.find(u=>!u.dead&&!u.isSummon&&!u.planned);selectedActorId=(next||actor).uid;
}
function canExecuteTurn(){return battle.allies.filter(u=>!u.dead&&!u.isSummon).every(u=>!!u.planned)}
document.getElementById('clearPlan').onclick=()=>{if(!battle||battle.busy)return;battle.allies.forEach(u=>u.planned=null);pendingCommand=null;selectedActorId=living(battle.allies).find(u=>!u.isSummon)?.uid||null;renderBattle()};
document.getElementById('executeTurn').onclick=executeTurn;

async function executeTurn(){
  if(!canExecuteTurn()||battle.busy)return;battle.busy=true;pendingCommand=null;
  allUnits().forEach(u=>{u.actionState=u.dead?'canceled':'pending';u.diedThisTurn=false});
  battle.enemies.forEach(aiPlan);battle.allies.filter(u=>u.isSummon&&!u.dead).forEach(u=>u.planned={skillId:'normal',targetUid:pick(living(battle.enemies))?.uid||null,label:'通常攻撃'});
  const actors=living(allUnits()).map(u=>({u,initiative:effectiveStat(u,'spd')*rnd(.9,1.1)})).sort((a,b)=>b.initiative-a.initiative);
  log(`TURN ${battle.turn}：行動順を決定。`,'sys');renderBattle();await wait(170);
  for(const item of actors){
    if(battle.over)break;const u=item.u;
    if(u.dead){u.actionState='canceled';continue}
    if(u.actionState==='canceled')continue;
    if(u.statuses.stop?.charges>0){u.statuses.stop.charges--;u.actionState='canceled';log(`${u.name}はストップで行動できない！`,'warn');if(u.statuses.stop.charges<=0)delete u.statuses.stop;renderBattle();await wait(180);continue}
    let plan=u.planned;if(!plan){u.actionState='done';continue}
    if(u.statuses.seal&&plan.skillId!=='normal'){u.actionState='canceled';log(`${u.name}は封印されていてスキルを使えない！`,'warn');renderBattle();await wait(160);continue}
    await resolveAction(u,plan);u.actionState='done';checkBattleEnd();renderBattle();await wait(190);
  }
  if(!battle.over){await endTurn();checkBattleEnd()}
  if(!battle.over){battle.turn++;allUnits().forEach(u=>u.planned=null);selectedActorId=living(battle.allies).find(u=>!u.isSummon)?.uid||null;battle.busy=false;renderBattle()}
}
function aiPlan(u){
  if(u.dead)return;const avail=u.skillIds.filter(id=>(u.cd[id]||0)<=0&&!u.statuses.seal);let chosen=null,target=null;
  const allies=sideUnits(u.side),foes=opponents(u.side),hurt=living(allies).filter(x=>x.hp/x.maxHp<.62),dead=allies.filter(x=>x.dead&&!x.isSummon);
  if(avail.includes('raise')&&dead.length)chosen='raise';
  else if(avail.includes('fairyHeal')&&living(allies).filter(x=>x.hp/x.maxHp<.58).length>=2)chosen='fairyHeal';
  else if(avail.includes('heal')&&hurt.length&&Math.random()<.7)chosen='heal';
  else if(avail.includes('regeneration')&&u.hp/u.maxHp<.48)chosen='regeneration';
  else if(avail.includes('cure')&&allies.some(x=>x.statuses.poison))chosen='cure';
  else if(avail.includes('poison')&&living(foes).some(x=>!x.statuses.poison)&&Math.random()<.65)chosen='poison';
  else if(avail.includes('stop')&&Math.random()<.35)chosen='stop';
  else if(avail.includes('allGuard')&&!living(allies).every(x=>x.buffs.some(b=>b.id==='allGuard'))&&Math.random()<.55)chosen='allGuard';
  else if(avail.includes('mount')&&Math.random()<.45)chosen='mount';
  else if(avail.includes('polish')&&Math.random()<.45)chosen='polish';
  else if(avail.includes('quick')&&Math.random()<.45)chosen='quick';
  else if(avail.includes('howl')&&Math.random()<.45)chosen='howl';
  else if(avail.length&&Math.random()<.65)chosen=pick(avail);
  if(!chosen)chosen='normal';const s=chosen==='normal'?{id:'normal',name:'通常攻撃',target:'enemy',kind:'normal'}:{id:chosen,...SKILLS[chosen]};
  if(s.target==='enemy')target=pick(living(foes));else if(s.target==='ally'){
    if(chosen==='heal')target=pick(hurt)||pick(living(allies));else if(chosen==='cure')target=allies.find(x=>x.statuses.poison)||pick(living(allies));else target=pick(living(allies));
  } else if(s.target==='deadAlly')target=pick(dead);else if(s.target==='self')target=u;
  u.planned={skillId:chosen,targetUid:target?.uid||null,label:s.name+(target?` → ${target.name}`:'')};
}
async function resolveAction(actor,plan){
  let s=plan.skillId==='normal'?{id:'normal',name:'通常攻撃',kind:'normal',target:'enemy',power:250,damageKind:'normal',element:'none'}:{id:plan.skillId,...SKILLS[plan.skillId]};
  if(s.id!=='normal')actor.cd[s.id]=s.ct;
  let target=plan.targetUid?getUnit(plan.targetUid):null;
  if(s.target==='enemy'&&(!target||target.dead)){target=pick(living(opponents(actor.side)));if(target)log(`${actor.name}の対象が倒れていたため、${target.name}へ狙いを変更。`,'sys')}
  if(s.target==='ally'&&(!target||target.dead))target=pick(living(sideUnits(actor.side)));
  if(s.target==='deadAlly'&&(!target||!target.dead)){target=sideUnits(actor.side).find(x=>x.dead&&!x.isSummon)||null}
  log(`${actor.name}の「${s.name}」！`);
  switch(s.kind){
    case 'normal':await hitDamage(actor,target,s);afterNormalAttack(actor);break;
    case 'damage':await hitDamage(actor,target,s);if(s.selfRecoil&&!actor.dead){const d=Math.max(1,Math.floor(actor.maxHp*s.selfRecoil));applyRawDamage(actor,d,`${actor.name}は反動で${d}ダメージ。`)}if(s.cancelChance&&target&&!target.dead&&target.actionState==='pending'&&Math.random()<s.cancelChance){target.actionState='canceled';log(`${target.name}の行動をキャンセルした！`,'warn')}break;
    case 'damageStatus':await hitDamage(actor,target,s);if(target&&!target.dead&&Math.random()<s.chance)applyStatus(target,s.status,{turns:s.duration});break;
    case 'multiDamage':{const ts=living(opponents(actor.side)).slice().sort(()=>Math.random()-.5).slice(0,s.count);for(const t of ts){await hitDamage(actor,t,s);checkBattleEnd();if(battle.over)break}break}
    case 'heal':heal(target,target.maxHp*s.amount,`${target.name}のHPが回復した。`);break;
    case 'healAll':living(sideUnits(actor.side)).forEach(t=>heal(t,t.maxHp*s.amount,`${t.name}のHPが回復した。`));break;
    case 'selfHeal':{const others=living(sideUnits(actor.side)).some(x=>x.uid!==actor.uid&&x.family==='スライム');heal(actor,actor.maxHp*(others ? .70 : .50),`${actor.name}は自己再生した。`);break}
    case 'buff':applyBuff(target,s);break;
    case 'buffAll':living(sideUnits(actor.side)).forEach(t=>applyBuff(t,s));break;
    case 'debuff':applyDebuff(target,s);break;
    case 'howl':living(opponents(actor.side)).filter(t=>t.actionState==='pending').forEach(t=>applyDebuff(t,{...s,stat:'atk',amount:-.35,duration:1,buffId:'howl'}));break;
    case 'poison':if(Math.random()<s.chance)applyStatus(target,'poison',{turns:s.duration});else log(`${target.name}には毒が効かなかった。`,'sys');break;
    case 'stop':applyStatus(target,'stop',{charges:s.charges});break;
    case 'curePoison':if(target.statuses.poison){delete target.statuses.poison;log(`${target.name}の毒が治った。`,'heal')}else log(`${target.name}は毒状態ではない。`,'sys');break;
    case 'mount':target.mount=true;log(`${target.name}にマウントを付与。`,'heal');break;
    case 'raise':if(target?.dead){target.dead=false;target.hp=Math.max(1,Math.round(target.maxHp*s.amount));target.actionState='canceled';log(`${target.name}がHP${target.hp}で復活した！`,'heal')}break;
  }
}
function damageAmount(a,t,s){
  const atk=effectiveStat(a,'atk'),def=effectiveStat(t,'def');let dmg=s.power*(Math.pow(atk,1.5)/(Math.pow(atk,1.5)+Math.pow(def,1.5)));
  let mult=1;if(t.weak.includes(s.element))mult*=1.5;if(t.resist.includes(s.element))mult*=.5;if(s.damageKind==='physical'&&t.resist.includes('physical'))mult*=.5;
  if(t.passive==='regenSlug'&&s.damageKind!=='physical')mult*=1.15;dmg*=mult*rnd(.9,1.1);return {damage:Math.max(1,Math.round(dmg)),mult};
}
async function hitDamage(a,t,s){if(!t||t.dead)return;const {damage,mult}=damageAmount(a,t,s);const hpBefore=t.hp;applyRawDamage(t,damage,`${t.name}に${damage}ダメージ${mult>1.01?'（弱点・増幅）':mult<.99?'（耐性）':''}。`);if(t.passive==='split'&&s.damageKind==='physical'&&hpBefore>0&&Math.random()<.10)trySplit(t);if(t.passive==='pureHunter'&&s.damageKind==='magic'&&s.element!=='pleasure'&&!t.dead&&Math.random()<.20){log(`${t.name}の「清純なる狩人」！ ${a.name}へ反撃。`,'sys');const counter={power:250,damageKind:'normal',element:'none'};const r=damageAmount(t,a,counter);applyRawDamage(a,r.damage,`${a.name}に反撃で${r.damage}ダメージ。`)} }
function applyRawDamage(t,amt,msg){if(t.dead)return;t.hp=Math.max(0,t.hp-amt);log(msg,'damage');if(t.hp<=0){t.dead=true;t.diedThisTurn=true;t.actionState='canceled';log(`${t.name}は戦闘不能になった。`,'warn')}}
function heal(t,amt,msg){if(!t||t.dead)return;const before=t.hp;t.hp=Math.min(t.maxHp,t.hp+Math.round(amt));const got=t.hp-before;if(got>0)log(`${msg} +${got}`,'heal')}
function applyBuff(t,s){if(!t||t.dead)return;const id=s.buffId||s.id;const existing=t.buffs.find(b=>b.id===id);if(existing){existing.duration=Math.max(existing.duration,s.duration);existing.amount=s.amount}else t.buffs.push({id,stat:s.stat,amount:s.amount,duration:s.duration});log(`${t.name}の${s.stat==='atk'?'攻撃':s.stat==='def'?'防御':'素早さ'}が${Math.abs(s.amount*100)}%上昇。`,'heal')}
function applyDebuff(t,s){if(!t||t.dead)return;if(t.mount){t.mount=false;log(`${t.name}のマウントがデバフを無効化した！`,'sys');return}const id=s.buffId||s.id;const existing=t.buffs.find(b=>b.id===id);if(existing){existing.duration=Math.max(existing.duration,s.duration);existing.amount=s.amount}else t.buffs.push({id,stat:s.stat,amount:s.amount,duration:s.duration});log(`${t.name}の${s.stat==='atk'?'攻撃':s.stat==='def'?'防御':'素早さ'}が${Math.abs(s.amount*100)}%低下。`,'warn')}
function applyStatus(t,type,data){if(!t||t.dead)return false;if(t.mount){t.mount=false;log(`${t.name}のマウントが状態異常を無効化した！`,'sys');return false}if(type==='poison'){t.statuses.poison={turns:data.turns};log(`${t.name}は毒状態になった。`,'warn')}if(type==='seal'){t.statuses.seal={turns:data.turns};log(`${t.name}は封印状態になった。`,'warn')}if(type==='stop'){t.statuses.stop={charges:data.charges};log(`${t.name}はストップ状態になった。`,'warn')}return true}
function afterNormalAttack(a){if(a.passive==='swiftDog'){a.normalCount++;if(a.normalCount%2===0&&a.swiftStacks<3){a.swiftStacks++;log(`${a.name}の俊敏わんこ！ 素早さ+20%（${a.swiftStacks}/3）。`,'heal')}}}
function trySplit(slime){const team=sideUnits(slime.side);if(team.some(x=>x.isSummon&&x.templateId==='slime'&&!x.dead))return;const c=CHARACTERS.find(x=>x.id==='slime');const s=makeUnit(c,slime.side,team.length);s.uid=`${slime.side}_slimecopy_${Math.random().toString(36).slice(2,6)}`;s.name='スライム娘';s.maxHp=100;s.hp=100;s.skillIds=[];s.passive=null;s.isSummon=true;s.actionState='canceled';team.push(s);log(`${slime.name}が分裂！ HP100のコピーが現れた。`,'sys')}

async function endTurn(){
  log('ターン終了処理。','sys');
  for(const u of living(allUnits())){
    if(u.statuses.poison){const d=Math.max(1,Math.floor(u.maxHp*.08));applyRawDamage(u,d,`${u.name}は毒で${d}ダメージ。`)}
    if(!u.dead&&u.passive==='regenSlug')heal(u,u.maxHp*.10,`${u.name}の再生ナメクジ。`);
  }
  for(const u of living(allUnits())){
    if(u.passive==='fairyHeal'&&Math.random()<.10){const hurt=living(sideUnits(u.side)).filter(x=>x.hp<x.maxHp);if(hurt.length){const t=pick(hurt);log(`${u.name}の「癒しの妖精」！`,'sys');heal(t,t.maxHp*.35,`${t.name}にヒール。`)}}
    if(u.passive==='timeThread'&&Math.random()<.10){const t=pick(living(sideUnits(u.side)));if(t){log(`${u.name}の「時繰りの糸」！ ${t.name}にクイック。`,'sys');applyBuff(t,{buffId:'quick',stat:'spd',amount:.30,duration:5})}}
  }
  allUnits().forEach(u=>{
    Object.keys(u.cd).forEach(k=>u.cd[k]=Math.max(0,u.cd[k]-1));
    u.buffs.forEach(b=>b.duration--);u.buffs=u.buffs.filter(b=>b.duration>0);
    for(const type of ['poison','seal'])if(u.statuses[type]){u.statuses[type].turns--;if(u.statuses[type].turns<=0){delete u.statuses[type];log(`${u.name}の${type==='poison'?'毒':'封印'}が解除された。`,'sys')}}
  });
  renderBattle();await wait(180);
}
function checkBattleEnd(){
  const a=living(battle.allies),e=living(battle.enemies);if(a.length&&e.length)return false;
  battle.over=true;battle.busy=false;const win=a.length>0;document.getElementById('resultTitle').textContent=win?'勝利！':'敗北…';document.getElementById('resultText').textContent=`${battle.turn}ターン目で戦闘終了。数値・CT・技の使用感を確認してみてください。`;document.getElementById('resultOverlay').classList.add('show');return true;
}
function log(text,cls=''){battle.log.push({text,cls});if(battle.log.length>160)battle.log.shift();renderLog()}
function renderLog(){const r=document.getElementById('battleLog');r.innerHTML=battle.log.map(x=>`<p class="${x.cls}">${escapeHtml(x.text)}</p>`).join('');r.scrollTop=r.scrollHeight}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
document.getElementById('backToSelect').onclick=()=>{document.getElementById('resultOverlay').classList.remove('show');document.getElementById('battleScreen').classList.remove('active');document.getElementById('selectScreen').classList.add('active');battle=null;selectedActorId=null;pendingCommand=null;renderRoster()};
renderRoster();
</script>
</body>
