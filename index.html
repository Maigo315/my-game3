<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔物娘トレハン v0.01</title>
<style>
:root{
  color-scheme: dark;
  --bg:#111015; --panel:#1b1821; --panel2:#24202c; --line:#3a3344;
  --text:#f5f0f7; --muted:#b8adbf; --accent:#d8b56b; --danger:#e36d7d;
  --good:#77c89b; --poison:#a6d85f; --rare:#73aaf7; --legend:#f0b35a;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#221c2b 0,#111015 44%,#0c0b0f 100%);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);min-height:100vh}
button{font:inherit}
.app{max-width:900px;margin:0 auto;padding:18px}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.04em}.version{font-size:.76rem;color:var(--muted);font-weight:600}
.floor{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);font-weight:800}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.75fr);gap:14px}
.panel{background:rgba(27,24,33,.94);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.battle{padding:16px}.side{display:flex;flex-direction:column;gap:14px}
.enemy-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.enemy-name{font-size:1.35rem;font-weight:900}.badge{font-size:.76rem;padding:4px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.enemy-image-wrap{position:relative;aspect-ratio:16/10;max-height:410px;background:linear-gradient(180deg,#2a2430,#151218);border-radius:13px;overflow:hidden;border:1px solid #302938;display:grid;place-items:center}
.enemy-image{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 18px rgba(0,0,0,.35));padding:8px}
.poison-aura{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,rgba(166,216,95,.08),transparent 62%);opacity:0;transition:.2s}.poison-aura.on{opacity:1}
.hp-row{margin-top:12px}.hp-label{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted);margin-bottom:5px}.bar{height:13px;border-radius:999px;background:#0e0c11;overflow:hidden;border:1px solid #352f3c}.bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ad4053,#e36d7d);transition:width .22s ease}.bar.player>i{background:linear-gradient(90deg,#4e936a,#77c89b)}
.statuses{display:flex;gap:7px;min-height:30px;margin-top:9px;flex-wrap:wrap}.status{font-size:.79rem;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#17131b}.status.poison{color:#d9f0b2;border-color:#60793d;background:#1c2516}
.actions{display:flex;gap:10px;margin-top:14px}.primary{flex:1;min-height:52px;border:0;border-radius:12px;background:linear-gradient(180deg,#e1bf76,#bd9144);color:#241b0d;font-weight:900;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.28)}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer}
.card{padding:14px}.card h2{font-size:.93rem;margin:0 0 10px;color:#e7dce9}.player-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:9px;background:#17141c;border-radius:10px;border:1px solid #302a37}.stat b{display:block;font-size:1rem}.stat span{font-size:.73rem;color:var(--muted)}
.weapon{padding:10px;border-radius:11px;background:#17141c;border:1px solid #302a37}.weapon-name{font-weight:900}.weapon-meta{font-size:.78rem;color:var(--muted);margin-top:3px}.affixes{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:.86rem}.affix.poison{color:#c7e690}.rarity-common{color:#e1dbe4}.rarity-rare{color:var(--rare)}.rarity-legendary{color:var(--legend);text-shadow:0 0 14px rgba(240,179,90,.18)}
.companion{display:grid;grid-template-columns:72px 1fr;gap:11px;align-items:center}.companion img{width:72px;height:72px;object-fit:cover;object-position:top;border-radius:12px;background:#161219;border:1px solid #38303f}.companion b{display:block}.companion p{margin:4px 0 0;font-size:.8rem;color:var(--muted);line-height:1.45}.companion strong{color:#d8f2a5}
.log{height:172px;overflow:auto;padding:11px;background:#0f0d12;border:1px solid #2d2733;border-radius:11px;font-size:.8rem;line-height:1.55}.log p{margin:0 0 5px}.log .good{color:#9addb5}.log .bad{color:#f09aa6}.log .gold{color:#e6c47d}.log .poison{color:#c7e690}
.overlay{position:fixed;inset:0;background:rgba(6,5,8,.72);display:none;place-items:center;padding:18px;z-index:10}.overlay.show{display:grid}.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:#1b1821;border:1px solid #50455c;border-radius:18px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.55)}.modal h2{margin:0 0 5px}.modal-sub{margin:0 0 14px;color:var(--muted);font-size:.85rem}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare .weapon{height:100%}.compare-label{font-size:.72rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}.modal-actions{display:flex;gap:10px;margin-top:15px}.modal-actions button{flex:1;min-height:48px}.result{text-align:center;padding:8px}.result .big{font-size:2rem;margin-bottom:6px}.result p{color:var(--muted);line-height:1.55}.tips{font-size:.75rem;color:var(--muted);margin-top:10px}
@media(max-width:700px){.app{padding:10px}.grid{grid-template-columns:1fr}.enemy-image-wrap{aspect-ratio:1/1;max-height:390px}.compare{grid-template-columns:1fr}.log{height:145px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">魔物娘トレハン <span class="version">v0.01</span></div>
    <div id="floorLabel" class="floor">FLOOR 1 / 10</div>
  </div>
  <div class="grid">
    <section class="panel battle">
      <div class="enemy-head">
        <div id="enemyName" class="enemy-name">スライム娘</div>
        <div id="enemyType" class="badge">NORMAL</div>
      </div>
      <div class="enemy-image-wrap">
        <img id="enemyImage" class="enemy-image" alt="敵の魔物娘">
        <div id="poisonAura" class="poison-aura"></div>
      </div>
      <div class="hp-row">
        <div class="hp-label"><span>ENEMY HP</span><strong id="enemyHpText">0 / 0</strong></div>
        <div class="bar"><i id="enemyHpBar"></i></div>
      </div>
      <div id="enemyStatuses" class="statuses"></div>
      <div class="actions">
        <button id="attackBtn" class="primary" type="button">⚔ 攻撃する</button>
      </div>
      <div class="tips">攻撃 → 毒ダメージ → 生存していれば敵の反撃。毒状態の敵にはラミアの効果で与ダメージ +30%。</div>
    </section>

    <aside class="side">
      <section class="panel card">
        <h2>冒険者</h2>
        <div class="hp-row" style="margin-top:0">
          <div class="hp-label"><span>PLAYER HP</span><strong id="playerHpText">100 / 100</strong></div>
          <div class="bar player"><i id="playerHpBar"></i></div>
        </div>
        <div class="player-stats" style="margin-top:10px">
          <div class="stat"><b id="attackStat">0</b><span>攻撃力</span></div>
          <div class="stat"><b id="critStat">0%</b><span>会心率</span></div>
        </div>
      </section>

      <section class="panel card">
        <h2>装備中の武器</h2>
        <div id="weaponCard" class="weapon"></div>
      </section>

  let state;

  const roll=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
  const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];

  function freshState(){
    return {
      floor:1, hp:playerBase.maxHp, enemy:null, busy:false, pendingLoot:null,
      weapon:{name:'錆びた剣',baseAttack:4,rarity:'common',rarityLabel:'コモン',affixes:[]},
      clears:0
    };
  }

  function rarityClass(r){ return 'rarity-'+r; }
  function rarityRoll(forceLegendary=false){
    if(forceLegendary) return {id:'legendary',label:'レジェンダリー',mult:1.20,count:2};
    const x=Math.random();
    if(x<0.05) return {id:'legendary',label:'レジェンダリー',mult:1.20,count:2};
    if(x<0.30) return {id:'rare',label:'レア',mult:1.10,count:1};
    return {id:'common',label:'コモン',mult:1.00,count:0};
  }
  function maxTierForFloor(f){ return f<=3?1:f<=6?2:f<=9?3:4; }
  function makeAffix(type, rarity, floor){
    const bonus = rarity==='legendary'?1:0;
    if(type==='attack') return {type,label:'攻撃力',value:roll(1+Math.floor(floor/4),3+Math.floor(floor/3)+bonus)};
    if(type==='crit') return {type,label:'会心率',value:roll(3,7+bonus*2)};
    return {type:'poison',label:'毒',value:roll(2+Math.floor(floor/5),5+Math.floor(floor/4)+bonus)};
  }
  function generateWeapon(floor, forceLegendary=false){
    const r=rarityRoll(forceLegendary);
    let pool = weapons.filter(w=>w.tier<=maxTierForFloor(floor));
    let base = pick(pool);
    if(forceLegendary && floor===10) base = weapons.find(w=>w.name==='風切りの剣');
    const types=['attack','crit','poison'];
    const chosen=[];
    for(let i=0;i<r.count;i++){
      const remaining=types.filter(t=>!chosen.includes(t));
      chosen.push(pick(remaining));
    }
    return {
      name:base.name,
      baseAttack:Math.max(1,Math.round(base.baseAttack*r.mult)),
      rarity:r.id, rarityLabel:r.label,
      affixes:chosen.map(t=>makeAffix(t,r.id,floor))
    };
  }
  function getAffix(w,type){ return w.affixes.find(a=>a.type===type)?.value || 0; }
  function playerAttackValue(){ return playerBase.baseAttack + state.weapon.baseAttack + getAffix(state.weapon,'attack'); }
  function playerCrit(){ return playerBase.baseCrit + getAffix(state.weapon,'crit')/100; }
  function playerPoison(){ return getAffix(state.weapon,'poison'); }

  function makeEnemy(floor){
    let key;
    if(floor===10) key='harpy';
    else if(floor<=3) key='slime';
    else if(floor<=6) key=Math.random()<0.35?'slime':'dog';
    else key=Math.random()<0.35?'dog':'snail';
    const d=enemyDefs[key];
    const scale=1+(floor-1)*0.05;
    const hp=Math.round(d.hp*scale);
    const atk=Math.round(d.attack*(1+(floor-1)*0.025));
    return {key,name:d.name,image:d.image,maxHp:hp,hp,attack:atk,poisonDamage:0,poisonTurns:0,boss:key==='harpy'};
  }

    const aff = w.affixes.length ? w.affixes.map(a=>{
      const cls=a.type==='poison'?'affix poison':'affix';
      const v=a.type==='crit'?`+${a.value}%`:`+${a.value}`;
      return `<div class="${cls}">${a.label} ${v}</div>`;
    }).join('') : '<div class="weapon-meta">特殊効果なし</div>';
    return `<div class="weapon-name ${rarityClass(w.rarity)}">${w.rarityLabel}・${w.name}</div><div class="weapon-meta">武器攻撃力 ${w.baseAttack}</div><div class="affixes">${aff}</div>`;
  }

  function log(text, cls=''){
    const p=document.createElement('p'); p.textContent=text; if(cls)p.className=cls;
    els.log.appendChild(p); els.log.scrollTop=els.log.scrollHeight;
  }

  function render(){
    const e=state.enemy;
    els.floor.textContent=`FLOOR ${state.floor} / ${MAX_FLOOR}`;
    els.enemyName.textContent=e.name;
    els.enemyType.textContent=e.boss?'BOSS':'NORMAL';
    els.enemyImage.src=e.image;
    els.enemyImage.alt=e.name;
    els.enemyHpText.textContent=`${Math.max(0,e.hp)} / ${e.maxHp}`;
    els.enemyHpBar.style.width=`${clamp(e.hp/e.maxHp*100,0,100)}%`;
    els.playerHpText.textContent=`${Math.max(0,state.hp)} / ${playerBase.maxHp}`;
    els.playerHpBar.style.width=`${clamp(state.hp/playerBase.maxHp*100,0,100)}%`;
    els.attackStat.textContent=playerAttackValue();
    els.critStat.textContent=Math.round(playerCrit()*100)+'%';
    els.weaponCard.innerHTML=weaponHTML(state.weapon);
    els.enemyStatuses.innerHTML='';
    if(e.poisonTurns>0){
      const s=document.createElement('div'); s.className='status poison'; s.textContent=`☠ 毒 ${e.poisonDamage} / ${e.poisonTurns}T`;
      els.enemyStatuses.appendChild(s); els.poisonAura.classList.add('on');
    } else els.poisonAura.classList.remove('on');
    els.attackBtn.disabled=state.busy || e.hp<=0 || state.hp<=0;
  }

  function startFloor(){
    state.enemy=makeEnemy(state.floor); state.busy=false;
    log(`FLOOR ${state.floor}：${state.enemy.name}が現れた。`, state.enemy.boss?'gold':'');
    render();
  }

  function attack(){
    if(state.busy || state.hp<=0 || state.enemy.hp<=0) return;
    state.busy=true;
    const e=state.enemy;
    const alreadyPoisoned=e.poisonTurns>0;
    let damage=playerAttackValue();
    let suffix='';
    if(alreadyPoisoned){ damage=Math.round(damage*1.30); suffix+=' ラミアの毒共鳴！'; }
    if(Math.random()<playerCrit()){ damage=Math.round(damage*1.5); suffix+=' 会心！'; }
    e.hp-=damage;
    log(`あなたの攻撃 → ${damage}ダメージ。${suffix}`, suffix?'gold':'');

    const poison=playerPoison();
    if(poison>0 && e.hp>0){
      e.poisonDamage=poison; e.poisonTurns=3;
      log(`武器の毒を付与。3ターン、毎ターン${poison}ダメージ。`,'poison');
    }
    render();
    if(e.hp<=0){ victory(); return; }

    if(e.poisonTurns>0){
      e.hp-=e.poisonDamage;
      e.poisonTurns--;
      log(`毒ダメージ → ${e.poisonDamage}。`,'poison');
      render();
      if(e.hp<=0){ victory(); return; }
    }

    state.hp-=e.attack;
    log(`${e.name}の反撃 → ${e.attack}ダメージ。`,'bad');
    if(state.hp<=0){ state.hp=0; render(); gameOver(); return; }
    state.busy=false; render();
  }

  function victory(){
    const e=state.enemy; e.hp=0; state.clears++; render();
    log(`${e.name}を倒した！`,'good');
    state.pendingLoot=generateWeapon(state.floor,e.boss);
    showLoot(e.boss);
  }

  function showLoot(isBoss){
    els.oldWeapon.innerHTML=weaponHTML(state.weapon);
    els.newWeapon.innerHTML=weaponHTML(state.pendingLoot);
    els.lootSub.textContent=isBoss?'ボスドロップ！ 風切りの剣はレジェンダリー確定です。':'敵が武器を落とした。どちらを使う？';
    els.lootOverlay.classList.add('show'); els.lootOverlay.setAttribute('aria-hidden','false');
  }
  function closeLoot(equip){
    if(equip){
      state.weapon=state.pendingLoot;
      log(`${state.weapon.rarityLabel}・${state.weapon.name}を装備した。`,'gold');
    } else log(`${state.pendingLoot.name}を見送った。`);
    state.pendingLoot=null;
    els.lootOverlay.classList.remove('show'); els.lootOverlay.setAttribute('aria-hidden','true');
    if(state.floor===MAX_FLOOR){ clearGame(); return; }
    const heal=20;
    const before=state.hp; state.hp=Math.min(playerBase.maxHp,state.hp+heal);
    const got=state.hp-before; if(got>0) log(`階層突破ボーナス：HPを${got}回復。`,'good');
    state.floor++; startFloor();
  }

  function gameOver(){
    state.busy=true;
    els.endIcon.textContent='💀'; els.endTitle.textContent='冒険失敗';
    els.endText.textContent=`FLOOR ${state.floor}で力尽きました。拾った武器はこの試作版では持ち越しません。`;
    els.endOverlay.classList.add('show'); els.endOverlay.setAttribute('aria-hidden','false');
  }
  function clearGame(){
    state.busy=true;
    els.endIcon.textContent='🏆'; els.endTitle.textContent='ハーピー討伐！';
    els.endText.textContent=`10階を踏破しました。最終装備は「${state.weapon.rarityLabel}・${state.weapon.name}」。v0.01クリアです。`;
    els.endOverlay.classList.add('show'); els.endOverlay.setAttribute('aria-hidden','false');
  }
  function restart(){
    state=freshState(); els.log.innerHTML='';
    els.endOverlay.classList.remove('show'); els.endOverlay.setAttribute('aria-hidden','true');
    els.lootOverlay.classList.remove('show'); els.lootOverlay.setAttribute('aria-hidden','true');
    log('ラミアと共にダンジョンへ入った。','good'); startFloor();
  }

  els.attackBtn.addEventListener('click',attack);
  els.keepBtn.addEventListener('click',()=>closeLoot(false));
  els.equipBtn.addEventListener('click',()=>closeLoot(true));
  els.restartBtn.addEventListener('click',restart);
  restart();
})();
</script>
</body>
</html>
