<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#15131b">
<title>魔物娘ダンジョン Prototype v0.1</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg:#111015; --panel:#1c1922; --panel2:#272330; --line:#433d4d;
    --text:#f4eef9; --muted:#aaa0b5; --good:#79d98c; --bad:#ef7d7d;
    --accent:#d8b4ff; --gold:#f0cf7b;
  }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  body { min-height:100dvh; overflow-x:hidden; }
  #app {
    width:min(100%, 520px); min-height:100dvh; margin:0 auto; background:#141219;
    display:flex; flex-direction:column; padding-bottom:max(8px, env(safe-area-inset-bottom));
  }
  header {
    height:40px; display:flex; align-items:center; justify-content:space-between;
    padding:0 12px; border-bottom:1px solid var(--line); background:#17141c;
  }
  header .title { font-size:13px; font-weight:800; letter-spacing:.04em; }
  header .floor { font-size:12px; color:var(--gold); }
  .view-wrap { position:relative; width:100%; aspect-ratio:1.28/1; max-height:48dvh; background:#050509; overflow:hidden; }
  #view { width:100%; height:100%; display:block; image-rendering:auto; }
  .view-vignette {
    pointer-events:none; position:absolute; inset:0;
    box-shadow: inset 0 0 70px rgba(0,0,0,.72), inset 0 -45px 60px rgba(0,0,0,.35);
  }
  .enemy-label {
    position:absolute; left:50%; top:10px; transform:translateX(-50%);
    font-size:12px; padding:5px 9px; border:1px solid rgba(255,255,255,.16);
    border-radius:999px; background:rgba(15,12,18,.72); backdrop-filter: blur(4px);
    opacity:0; transition:opacity .12s;
  }
  .enemy-label.show { opacity:1; }
  .map-card {
    position:absolute; right:8px; bottom:8px; width:104px; height:104px;
    border:1px solid rgba(255,255,255,.18); border-radius:10px; overflow:hidden;
    background:rgba(8,7,10,.74); backdrop-filter: blur(4px);
  }
  #map { width:100%; height:100%; display:block; }
  .flash { position:absolute; inset:0; pointer-events:none; opacity:0; }
  .flash.hit { animation:hitflash .22s ease-out; }
  @keyframes hitflash { 0%{opacity:.45;background:#b62929} 100%{opacity:0;background:#b62929} }

  .info { padding:8px 10px 0; display:grid; gap:7px; }
  .party { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .member {
    min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 8px;
  }
  .member.front { border-color:#9d7ac2; box-shadow: inset 0 0 0 1px rgba(216,180,255,.12); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .role { font-size:10px; color:var(--accent); font-weight:800; }
  .name { font-size:12px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hptext { font-size:10px; color:var(--muted); }
  .bar { height:6px; margin-top:5px; border-radius:999px; overflow:hidden; background:#0e0d11; border:1px solid #302b37; }
  .bar > i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#6bc47b,#9de0a8); transition:width .15s; }
  .bar.danger > i { background:linear-gradient(90deg,#d65f5f,#f09393); }

  .message {
    min-height:42px; max-height:54px; overflow:hidden; padding:7px 9px;
    background:#17141c; border:1px solid #37313f; border-radius:10px;
    font-size:11px; line-height:1.55; color:#ded6e6;
  }
  .message b { color:#fff; }

  .controls { margin-top:auto; padding:8px 10px 0; display:grid; gap:8px; }
  .combat { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .move { display:grid; grid-template-columns:1fr 1.1fr 1fr; gap:6px; align-items:stretch; }
  .move .mid { display:grid; grid-template-rows:1fr 1fr; gap:6px; }
  button {
    appearance:none; border:1px solid #4b4356; border-radius:11px; color:var(--text);
    background:linear-gradient(#302b38,#24202b); font-weight:800; font-size:13px;
    min-height:48px; touch-action:manipulation; box-shadow:0 2px 0 #0b0a0d;
  }
  button:active { transform:translateY(1px); filter:brightness(1.12); box-shadow:0 1px 0 #0b0a0d; }
  button.primary { border-color:#725a8d; background:linear-gradient(#554065,#362a42); }
  button.warn { border-color:#755050; }
  button:disabled { opacity:.38; filter:saturate(.4); }
  .hint { text-align:center; color:#766d80; font-size:9px; padding-top:1px; }

  .overlay {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(5,4,7,.84); z-index:20; padding:22px;
  }
  .overlay.show { display:flex; }
  .modal {
    width:min(100%,420px); background:#1c1922; border:1px solid #554c62;
    border-radius:16px; padding:18px; text-align:center;
  }
  .modal h2 { margin:0 0 8px; font-size:22px; }
  .modal p { margin:0 0 14px; color:#c4b9ce; font-size:13px; line-height:1.7; }
  .modal button { width:100%; }
  @media (orientation:landscape) and (max-height:600px) {
    #app { width:100%; max-width:900px; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);
      grid-template-rows:40px 1fr; }
    header { grid-column:1/3; }
    .view-wrap { max-height:none; height:calc(100dvh - 40px); aspect-ratio:auto; }
    .side { min-height:0; display:flex; flex-direction:column; overflow:auto; }
    .controls { margin-top:0; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">魔物娘ダンジョン <span style="color:#857b90;font-weight:600">Prototype v0.1</span></div>
    <div class="floor">B1F</div>
  </header>

  <div class="view-wrap">
    <canvas id="view" width="720" height="560"></canvas>
    <div id="enemyLabel" class="enemy-label"></div>
    <div class="map-card"><canvas id="map" width="208" height="208"></canvas></div>
    <div class="view-vignette"></div>
    <div id="flash" class="flash"></div>
  </div>

  <div class="side">
    <section class="info">
      <div class="party">
        <div id="playerCard" class="member front">
          <div class="row"><span id="playerRole" class="role">前衛</span><span class="hptext" id="playerHpText">30/30</span></div>
          <div class="name">主人公</div>
          <div id="playerBar" class="bar"><i></i></div>
        </div>
        <div id="slimeCard" class="member">
          <div class="row"><span id="slimeRole" class="role">後衛</span><span class="hptext" id="slimeHpText">22/22</span></div>
          <div class="name">スライム娘</div>
          <div id="slimeBar" class="bar"><i></i></div>
        </div>
      </div>
      <div id="message" class="message">薄暗い地下迷宮に足を踏み入れた。<br>奥の階段を目指そう。</div>
    </section>

    <section class="controls">
      <div class="combat">
        <button id="attackBtn" class="primary">攻撃</button>
        <button id="swapBtn">交代</button>
        <button id="waitBtn">待機</button>
        <button id="resetBtn" class="warn">やり直し</button>
      </div>
      <div class="move">
        <button id="leftBtn">↶<br>左旋回</button>
        <div class="mid">
          <button id="forwardBtn" class="primary">▲ 前進</button>
          <button id="backBtn">▼ 後退</button>
        </div>
        <button id="rightBtn">↷<br>右旋回</button>
      </div>
      <div class="hint">旋回は無料。移動・攻撃・交代・待機で1ターン進行。PCでは W/S/A/D・Space・Q も使えます。</div>
    </section>
  </div>
</div>

<div id="overlay" class="overlay">
  <div class="modal">
    <h2 id="overlayTitle"></h2>
    <p id="overlayText"></p>
    <button id="restartBtn" class="primary">もう一度潜る</button>
  </div>
</div>

];

const START = {x:1,y:1,dir:1};
const GOAL = {x:13,y:13};

let state;

function makeEnemy(x,y,id) {
  return { id, x, y, hp:16, maxHp:16, atk:5, awake:false, dead:false };
}

function resetGame() {
  state = {
    turn:0,
    over:false,
    clear:false,
    player:{x:START.x,y:START.y,dir:START.dir,hp:30,maxHp:30,atk:7},
    slime:{hp:22,maxHp:22,atk:5},
    front:"player",
    enemies:[
      makeEnemy(9,3,1),
      makeEnemy(12,7,2),
      makeEnemy(5,11,3),
    ],
    explored:new Set(),
    logs:["薄暗い地下迷宮に足を踏み入れた。","奥の階段を目指そう。"],
  };
  revealAroundPlayer();
  hideOverlay();
  renderAll();
}

function key(x,y){ return x+","+y; }
function isWall(x,y){ return y<0 || y>=H || x<0 || x>=W || grid[y][x]==="#"; }
function enemyAt(x,y){ return state.enemies.find(e=>!e.dead && e.x===x && e.y===y); }
function occupied(x,y){ return !!enemyAt(x,y); }
function addLog(msg){
  state.logs.push(msg);
  if(state.logs.length>5) state.logs.shift();
  const last = state.logs.slice(-2);
  document.getElementById("message").innerHTML = last.map((x,i)=> i===last.length-1 ? "<b>"+x+"</b>" : x).join("<br>");
}

function revealAroundPlayer(){
  const p=state.player;
  for(let y=p.y-2;y<=p.y+2;y++) for(let x=p.x-2;x<=p.x+2;x++){
    if(x>=0&&y>=0&&x<W&&y<H && Math.abs(x-p.x)+Math.abs(y-p.y)<=3) state.explored.add(key(x,y));
  }
  // reveal along facing direction until wall
  const d=dirs[p.dir];
  for(let i=1;i<=6;i++){
    const x=p.x+d.x*i, y=p.y+d.y*i;
    if(x<0||y<0||x>=W||y>=H) break;
    state.explored.add(key(x,y));
    if(isWall(x,y)) break;
  }
}

function lineOfSight(ax,ay,bx,by,maxDist=8){
  const dx=bx-ax, dy=by-ay;
  const dist=Math.hypot(dx,dy);
  if(dist>maxDist) return false;
  const steps=Math.ceil(dist*8);
  for(let i=1;i<steps;i++){
    const t=i/steps;
    const x=Math.floor(ax+0.5+dx*t);
    const y=Math.floor(ay+0.5+dy*t);
    if(isWall(x,y)) return false;
  }
  return true;
}

function movePlayer(dx,dy){
  if(state.over) return;
  const p=state.player;
  const nx=p.x+dx, ny=p.y+dy;
  if(isWall(nx,ny)){
    addLog("壁に行く手を阻まれた。");
    renderAll();
    return;
  }
  const e=enemyAt(nx,ny);
  if(e){
    addLog("犬娘が進路を塞いでいる。");
    renderAll();
    return;
  }
  p.x=nx; p.y=ny;
  addLog("一歩進んだ。");
  afterPlayerAction();
}

function moveForward(sign=1){
  const d=dirs[state.player.dir];
  movePlayer(d.x*sign,d.y*sign);
}
function turn(delta){
  if(state.over) return;
  state.player.dir=(state.player.dir+delta+4)%4;
  revealAroundPlayer();
  renderAll();
}

function attack(){
  if(state.over) return;
  const p=state.player, d=dirs[p.dir];
  const tx=p.x+d.x, ty=p.y+d.y;
  const e=enemyAt(tx,ty);
  if(state.front==="player"){
    if(e){
      e.hp-=p.atk;
      addLog(`主人公の攻撃。犬娘に ${p.atk} ダメージ！`);
      if(e.hp<=0){ e.dead=true; addLog("犬娘を倒した。"); }
    } else {
      addLog("主人公は武器を振ったが、届く敵はいない。");
    }
  } else {
    // player gives command; slime actually attacks in ally phase
    addLog(e ? "スライム娘に攻撃を指示した。" : "スライム娘に前方警戒を指示した。");
  }
  afterPlayerAction({slimeAttack:true});
}

function swapFront(){
  if(state.over) return;
  if(state.slime.hp<=0){ addLog("スライム娘は戦えない。"); renderAll(); return; }
  state.front = state.front==="player" ? "slime" : "player";
  addLog(state.front==="slime" ? "スライム娘が前衛に出た。" : "主人公が前衛に戻った。");
  afterPlayerAction();
}

function waitTurn(){
  if(state.over) return;
  addLog("様子をうかがった。");
  afterPlayerAction();
}

function afterPlayerAction(opts={}){
  state.turn++;
  revealAroundPlayer();
  wakeEnemies();
  enemyPhase();
  if(!state.over) allyPhase(opts);
  if(!state.over) checkGoal();
  revealAroundPlayer();
  renderAll();
}

function wakeEnemies(){
  const p=state.player;
  for(const e of state.enemies){
    if(e.dead) continue;
    const dist=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
    if(dist<=5 && lineOfSight(e.x,e.y,p.x,p.y,7)) e.awake=true;
    if(dist<=2) e.awake=true;
  }
}

function enemyPhase(){
  const p=state.player;
  for(const e of state.enemies){
    if(e.dead || !e.awake || state.over) continue;
    const dist=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
    if(dist===1){
      hitFront(e.atk);
      continue;
    }
    const step=findEnemyStep(e);
    if(step){ e.x=step.x; e.y=step.y; }
    const ndist=Math.abs(e.x-p.x)+Math.abs(e.y-p.y);
    if(ndist===1 && !state.over){
      // no attack on same turn as movement in this prototype
    }
  }
}

function hitFront(dmg){
  const flash=document.getElementById("flash");
  flash.classList.remove("hit"); void flash.offsetWidth; flash.classList.add("hit");
  if(state.front==="slime" && state.slime.hp>0){
    state.slime.hp-=dmg;
    addLog(`犬娘の攻撃。スライム娘が ${dmg} ダメージを受けた。`);
    if(state.slime.hp<=0){
      state.slime.hp=0;
      state.front="player";
      addLog("スライム娘は力尽き、主人公が前へ出た。");
    }
  } else {
    state.player.hp-=dmg;
    addLog(`犬娘の攻撃。主人公が ${dmg} ダメージを受けた。`);
    if(state.player.hp<=0){
      state.player.hp=0;
      gameOver();
    }
  }
}

function allyPhase(opts={}){
  if(state.slime.hp<=0 || state.front!=="slime") return;
  const p=state.player, d=dirs[p.dir];
  let target=enemyAt(p.x+d.x,p.y+d.y);
  if(!target){
    // If an enemy is adjacent but not in front, slime can fend it off automatically.
    target=state.enemies.find(e=>!e.dead && Math.abs(e.x-p.x)+Math.abs(e.y-p.y)===1);
  }
  if(target){
    target.hp-=state.slime.atk;
    addLog(`スライム娘の攻撃。犬娘に ${state.slime.atk} ダメージ！`);
    if(target.hp<=0){ target.dead=true; addLog("スライム娘が犬娘を倒した。"); }
  }
}

function findEnemyStep(e){
  const p=state.player;
  const q=[{x:e.x,y:e.y}];
  const prev=new Map([[key(e.x,e.y),null]]);
  let goalKey=null;
  while(q.length){
    const cur=q.shift();
    if(Math.abs(cur.x-p.x)+Math.abs(cur.y-p.y)===1){ goalKey=key(cur.x,cur.y); break; }
    for(const d of dirs){
      const nx=cur.x+d.x, ny=cur.y+d.y, k=key(nx,ny);
      if(isWall(nx,ny) || prev.has(k)) continue;
      if(nx===p.x && ny===p.y) continue;
      const occ=enemyAt(nx,ny);
      if(occ && occ.id!==e.id) continue;
      prev.set(k,key(cur.x,cur.y)); q.push({x:nx,y:ny});
    }
    if(prev.size>160) break;
  }
  if(!goalKey) return null;
  let cur=goalKey, before=prev.get(cur);
  while(before && before!==key(e.x,e.y)){
    cur=before; before=prev.get(cur);
  }
  const [x,y]=cur.split(",").map(Number);
  if(x===e.x&&y===e.y) return null;
  return {x,y};
}

function checkGoal(){
  const p=state.player;
  if(p.x===GOAL.x && p.y===GOAL.y){
    state.clear=true; state.over=true;
    showOverlay("B1F 踏破！", `試作版クリア。${state.turn} ターンで階段に到達しました。<br>この段階では「主観視点＋ミニマップ＋前衛交代」の感触を見るための1フロアです。`);
  }
}
function gameOver(){
  state.over=true;
  showOverlay("GAME OVER", `主人公は迷宮で倒れた。<br>${state.turn} ターン目で探索終了。`);
}

function hideOverlay(){ document.getElementById("overlay").classList.remove("show"); }

  const label=document.getElementById("enemyLabel");
  if(frontEnemy){
    label.textContent=`犬娘　HP ${Math.max(0,frontEnemy.hp)}/${frontEnemy.maxHp}`;
    label.classList.add("show");
  } else label.classList.remove("show");
}

function angleNorm(a){
  while(a<-Math.PI) a+=Math.PI*2;
  while(a> Math.PI) a-=Math.PI*2;
  return a;
}
function dirAngle(dir){ return [-Math.PI/2,0,Math.PI/2,Math.PI][dir]; }

function castRay(angle){
  const p=state.player;
  const ox=p.x+.5, oy=p.y+.5;
  const sin=Math.sin(angle), cos=Math.cos(angle);
  let dist=0, hitX=0, hitY=0;
  while(dist<MAX_DEPTH){
    dist+=.025;
    const x=ox+cos*dist, y=oy+sin*dist;
    const gx=Math.floor(x), gy=Math.floor(y);
    if(isWall(gx,gy)){ hitX=x;hitY=y;break; }
  }
  return {dist,hitX,hitY};
}

function renderView(){
  const w=view.width,h=view.height;
  // ceiling / floor
  const grad=vctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,"#151724");
  grad.addColorStop(.48,"#242536");
  grad.addColorStop(.505,"#2b2630");
  grad.addColorStop(1,"#151116");
  vctx.fillStyle=grad; vctx.fillRect(0,0,w,h);

  // subtle floor lines
  vctx.strokeStyle="rgba(255,255,255,.035)";
  for(let i=1;i<7;i++){
    const y=h/2 + (h/2)*(1-1/(i*.55+1));
    vctx.beginPath(); vctx.moveTo(0,y); vctx.lineTo(w,y); vctx.stroke();
  }

  const base=dirAngle(state.player.dir);
  const depths=new Array(RAYS);
  const slice=w/RAYS+1;
  for(let i=0;i<RAYS;i++){
    const rayAngle=base-FOV/2 + (i/(RAYS-1))*FOV;
    let r=castRay(rayAngle);
    const corrected=r.dist*Math.cos(rayAngle-base);
    depths[i]=corrected;
    const wallH=Math.min(h*1.35, h/(Math.max(.12,corrected)*.9));
    const y=(h-wallH)/2;
    let shade=Math.max(30, 190-corrected*17);
    // alternating stone tint
    vctx.fillStyle=`rgb(${Math.floor(shade*.52)},${Math.floor(shade*.50)},${Math.floor(shade*.60)})`;
    vctx.fillRect(i*slice,y,slice+1,wallH);
    vctx.fillStyle=`rgba(255,255,255,${Math.max(0,.10-corrected*.009)})`;
    vctx.fillRect(i*slice,y,slice+1,2);
  }

  renderGoalSprite(depths,base);
  renderEnemies(depths,base);

  // center reticle
  vctx.strokeStyle="rgba(255,255,255,.28)";
  vctx.beginPath(); vctx.moveTo(w/2-7,h/2);vctx.lineTo(w/2+7,h/2);
  vctx.moveTo(w/2,h/2-7);vctx.lineTo(w/2,h/2+7);vctx.stroke();
}

function projectEntity(wx,wy,base){
  const p=state.player;
  const dx=(wx+.5)-(p.x+.5), dy=(wy+.5)-(p.y+.5);
  const dist=Math.hypot(dx,dy);
  const ang=angleNorm(Math.atan2(dy,dx)-base);
  if(Math.abs(ang)>FOV*.62 || dist<.15) return null;
  const sx=(.5 + ang/FOV)*view.width;
  return {dist,ang,sx};
}

function renderEnemies(depths,base){
  const visible=[];
  for(const e of state.enemies){
    if(e.dead) continue;
    const pr=projectEntity(e.x,e.y,base);
    if(!pr || !lineOfSight(state.player.x,state.player.y,e.x,e.y,10)) continue;
    visible.push({e,...pr});
  }
  visible.sort((a,b)=>b.dist-a.dist);
  for(const it of visible){
    const idx=Math.max(0,Math.min(RAYS-1,Math.floor(it.sx/view.width*RAYS)));
    if(depths[idx]+.18<it.dist) continue;
    const scale=Math.min(1.25,1.35/it.dist);
    const ih=view.height*scale;
    const iw=ih;
    const x=it.sx-iw/2, y=view.height/2-ih*.44;
    vctx.save();
    vctx.globalAlpha=Math.min(1,.4+3/it.dist);
    vctx.drawImage(dogImg,x,y,iw,ih);
    vctx.restore();
  }
}

function renderGoalSprite(depths,base){
  const pr=projectEntity(GOAL.x,GOAL.y,base);
  if(!pr || !lineOfSight(state.player.x,state.player.y,GOAL.x,GOAL.y,12)) return;
  const idx=Math.max(0,Math.min(RAYS-1,Math.floor(pr.sx/view.width*RAYS)));
  if(depths[idx]+.2<pr.dist) return;
  const size=Math.max(22,180/pr.dist);
  const x=pr.sx-size/2, y=view.height/2 + Math.min(120,170/pr.dist);
  vctx.save();
  vctx.translate(x+size/2,y+size/2);
  vctx.fillStyle="rgba(238,205,111,.92)";
  vctx.strokeStyle="#fff0a7"; vctx.lineWidth=3;
  vctx.beginPath(); vctx.moveTo(-size*.42,-size*.18); vctx.lineTo(size*.42,-size*.18);
  vctx.lineTo(size*.28,size*.18); vctx.lineTo(-size*.28,size*.18); vctx.closePath(); vctx.fill(); vctx.stroke();
  vctx.restore();
}

function getFrontVisibleEnemy(){
  const p=state.player,d=dirs[p.dir];
  for(let i=1;i<=6;i++){
    const x=p.x+d.x*i,y=p.y+d.y*i;
    if(isWall(x,y)) break;
    const e=enemyAt(x,y);
    if(e) return e;
  }
  return null;
}

function renderMap(){
  const cw=mapCanvas.width,ch=mapCanvas.height;
  mctx.clearRect(0,0,cw,ch);
  mctx.fillStyle="#0b0a0d"; mctx.fillRect(0,0,cw,ch);
  const cell=Math.floor(Math.min(cw/W,ch/H));
  const ox=Math.floor((cw-cell*W)/2), oy=Math.floor((ch-cell*H)/2);

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(!state.explored.has(key(x,y))) continue;
    if(isWall(x,y)){
      mctx.fillStyle="#514b59";
    }else{
      mctx.fillStyle="#24202a";
    }
    mctx.fillRect(ox+x*cell,oy+y*cell,cell-1,cell-1);
  }

  // goal, once explored
  if(state.explored.has(key(GOAL.x,GOAL.y))){
    mctx.fillStyle="#e8c86e";
    mctx.fillRect(ox+GOAL.x*cell+cell*.2,oy+GOAL.y*cell+cell*.2,cell*.6,cell*.6);
  }

  // enemies only when currently visible or adjacent
  for(const e of state.enemies){
    if(e.dead) continue;
    const d=Math.abs(e.x-state.player.x)+Math.abs(e.y-state.player.y);
    if(d<=2 || lineOfSight(state.player.x,state.player.y,e.x,e.y,6)){
      mctx.fillStyle="#de7474";
      mctx.beginPath();
      mctx.arc(ox+(e.x+.5)*cell,oy+(e.y+.5)*cell,cell*.32,0,Math.PI*2);
      mctx.fill();
    }
  }

  // player arrow
  const p=state.player;
  const cx=ox+(p.x+.5)*cell, cy=oy+(p.y+.5)*cell;
  const a=dirAngle(p.dir);
  mctx.save(); mctx.translate(cx,cy); mctx.rotate(a+Math.PI/2);
  mctx.fillStyle="#efe8fa";
  mctx.beginPath(); mctx.moveTo(0,-cell*.48);mctx.lineTo(cell*.38,cell*.38);mctx.lineTo(0,cell*.22);mctx.lineTo(-cell*.38,cell*.38);mctx.closePath();mctx.fill();
  mctx.restore();
}

function resizeCanvas(){
  const rect=view.getBoundingClientRect();
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const nw=Math.max(480,Math.floor(rect.width*dpr));
  const nh=Math.max(360,Math.floor(rect.height*dpr));
  if(view.width!==nw||view.height!==nh){ view.width=nw; view.height=nh; }
  renderAll();
}
window.addEventListener("resize",resizeCanvas);

document.getElementById("forwardBtn").onclick=()=>moveForward(1);
document.getElementById("backBtn").onclick=()=>moveForward(-1);
document.getElementById("leftBtn").onclick=()=>turn(-1);
document.getElementById("rightBtn").onclick=()=>turn(1);
document.getElementById("attackBtn").onclick=attack;
document.getElementById("swapBtn").onclick=swapFront;
document.getElementById("waitBtn").onclick=waitTurn;
document.getElementById("resetBtn").onclick=resetGame;
document.getElementById("restartBtn").onclick=resetGame;

window.addEventListener("keydown",(e)=>{
  const k=e.key.toLowerCase();
  if(["w","s","a","d"," ","q","r"].includes(k)) e.preventDefault();
  if(k==="w"||e.key==="ArrowUp") moveForward(1);
  else if(k==="s"||e.key==="ArrowDown") moveForward(-1);
  else if(k==="a"||e.key==="ArrowLeft") turn(-1);
  else if(k==="d"||e.key==="ArrowRight") turn(1);
  else if(k===" ") attack();
  else if(k==="q") swapFront();
  else if(k==="r") resetGame();
},{passive:false});

Promise.all([
  new Promise(r=>dogImg.onload=r),
  new Promise(r=>slimeImg.onload=r),
]).then(()=>renderAll());

resetGame();
setTimeout(resizeCanvas,0);
</script>
